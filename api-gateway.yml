server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    allow-bean-definition-overriding: true
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/order/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payment/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    env:
      access: unrestricted
    health:
      show-details: always
